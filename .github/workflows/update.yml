name: update
on:
  schedule:
    - cron: '*/10 23 * * *'     # JST 8:00-8:59
    - cron: '*/10 0-12 * * *'   # JST 9:00-21:59
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: 答え合わせ（前日まで）
        run: python3 navi.py settle
      - name: 締切が近いレースを予想
        run: python3 navi.py predict
      - name: ページ作成
        run: |
          python3 navi.py build
          mkdir -p site && cp index.html site/
      - name: データを保存
        run: |
          git config user.name "boat-navi-bot"
          git config user.email "boat-navi-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "update $(TZ=Asia/Tokyo date +%m/%d-%H:%M)" && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
